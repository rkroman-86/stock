name: APK Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Vérifier le secret de signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret KEYSTORE_PASSWORD manquant : Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: Compiler l'APK signée
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk gestion-stock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gestion-stock-apk
          path: gestion-stock.apk

      - name: Publier dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: Gestion de stock — APK 1.${{ github.run_number }}
          body: |
            APK Android de l'appli Gestion de stock (ouvre https://rkroman-86.github.io/stock/ en plein écran via Chrome).
            Téléchargez **gestion-stock.apk** ci-dessous et ouvrez-le sur le téléphone.
          files: gestion-stock.apk
          make_latest: true

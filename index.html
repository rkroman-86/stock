<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gestion de stock</title>
<link rel="manifest" href="stock.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#f3f4f1; --surface:#fff; --surface2:#eceee9; --text:#1b1f1d; --muted:#69716c; --line:#dcdfda;
  --accent:#0f766e; --accent-ink:#fff;
  --in:#15803d; --in-bg:#e5f5ea; --out:#c2410c; --out-bg:#fdede3;
  --warn:#a16207; --low-bg:#fdf3d0; --danger:#b91c1c; --zero-bg:#fde4e4;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111413; --surface:#1a1f1d; --surface2:#232926; --text:#e7ebe8; --muted:#97a09a; --line:#2e3532;
  --accent:#2dd4bf; --accent-ink:#04201c;
  --in:#4ade80; --in-bg:#12301e; --out:#fb923c; --out-bg:#3a2213;
  --warn:#fbbf24; --low-bg:#3a3010; --danger:#f87171; --zero-bg:#3d1717; --shadow:none;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:var(--text);text-decoration:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:999px;padding:6px 10px;font:600 12px system-ui;cursor:pointer;white-space:nowrap}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.badge.ok i{background:var(--in)}.badge.dirty i{background:var(--warn)}.badge.err i{background:var(--danger)}
.badge.busy i{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.iconbtn{border:none;background:transparent;color:var(--text);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:1.4fr 1fr;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.bottombar .btn{min-height:50px;font-size:16px}
@media(min-width:720px){.bottombar{left:50%;right:auto;transform:translateX(-50%);width:520px;border:1px solid var(--line);border-bottom:none;border-radius:16px 16px 0 0}}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-weight:600;padding:10px 14px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.in{background:var(--in-bg);color:var(--in);border-color:transparent}
.btn.out{background:var(--out-bg);color:var(--out);border-color:transparent}
.btn.big{min-height:54px;font-size:17px}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);background:transparent;border-color:var(--danger)}
.btn.sq{width:46px;padding:0;flex:none}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.summary div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column}
.summary b{font-size:17px}.summary span{font-size:11px;color:var(--muted)}
.search input{width:100%}
.chips{display:flex;gap:6px;margin:10px 0 12px;overflow-x:auto}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 14px;font:600 13px system-ui;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.grid{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:720px){.grid{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}}
.card{display:grid;grid-template-columns:64px 1fr auto;grid-template-areas:"t i s" "a a a";gap:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);cursor:pointer}
.thumb{grid-area:t;width:64px;height:64px;border-radius:10px;background:var(--surface2);overflow:hidden;display:grid;place-items:center;font-size:26px}
.thumb img{width:100%;height:100%;object-fit:cover}
.info{grid-area:i;min-width:0}
.info h3{margin:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code{font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
.price{font-size:13px;margin-top:3px}.price small{color:var(--muted)}
.stock{grid-area:s;text-align:center;min-width:58px;padding:6px 8px;border-radius:10px;align-self:start}
.stock b{display:block;font-size:20px;line-height:1.1}.stock small{font-size:10px;opacity:.8}
.ok{background:var(--in-bg);color:var(--in)}.low{background:var(--low-bg);color:var(--warn)}.zero{background:var(--zero-bg);color:var(--danger)}
.cact{grid-area:a;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{text-align:center;color:var(--muted);padding:40px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}

.back{display:inline-block;margin-bottom:10px;text-decoration:none;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 12px;font-size:16px}
.stockbig{display:flex;align-items:baseline;justify-content:space-between;border-radius:12px;padding:12px 16px;margin-bottom:12px}
.stockbig b{font-size:34px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.row3 .btn{padding:10px 6px;font-size:14px}
.qr-box{text-align:center;background:var(--surface2);border-radius:12px;padding:12px}
.qr-box img{width:min(240px,70%);aspect-ratio:1/1.32;object-fit:contain;border-radius:8px;background:#fff;display:block;margin:0 auto}
.photo-wrap{margin-bottom:14px}
.photo{width:100%;aspect-ratio:4/3;max-height:340px;background:var(--surface2);border-radius:12px;overflow:hidden;display:grid;place-items:center}
.photo img{width:100%;height:100%;object-fit:contain}
.ph{display:flex;flex-direction:column;align-items:center;font-size:40px;color:var(--muted)}.ph small{font-size:13px}
.photo-btns{display:flex;gap:8px;margin-top:8px}.photo-btns .btn{flex:1;white-space:nowrap;padding:10px 8px;min-width:0}
.form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
label.check{flex-direction:row;align-items:center;gap:10px;color:var(--text);font-weight:500;font-size:14px}
label.check input{width:20px;height:20px}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline{display:flex;gap:6px}
.margin{font-size:13px;color:var(--muted);margin-top:-4px}
.bc-box{background:#fff;border-radius:12px;padding:8px;display:flex;justify-content:center;margin:12px 0}
.bc-box svg{max-width:100%;height:auto}
.inline.vat select{flex:1}.inline.vat input{width:96px;flex:none;text-align:center}
.bc-box.lbl{background:var(--surface2);padding:14px}
.bc-box.lbl img{display:block;max-width:100%;max-height:240px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.18);border-radius:4px}
.muted{color:var(--muted)}.small{font-size:13px}
.mv{display:grid;grid-template-columns:1fr auto 32px;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mv:first-child{border-top:none}
.mvl b{font-size:16px}.mv.in .mvl b{color:var(--in)}.mv.out .mvl b{color:var(--out)}
.mvl small{display:block;color:var(--muted)}
.mvr{text-align:right;font-size:13px}
.x{border:none;background:transparent;color:var(--muted);font-size:16px;cursor:pointer;height:32px}
.status{display:block;background:var(--surface2);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);margin-right:4px}
.dot.ok{background:var(--in)}.dot.dirty{background:var(--warn)}.dot.err{background:var(--danger)}
.stack{display:flex;flex-direction:column;gap:10px}
details{margin-top:12px;font-size:14px}details summary{cursor:pointer;font-weight:600}
details ol{padding-left:20px}details li{margin:6px 0}
code{background:var(--surface2);padding:1px 5px;border-radius:5px;font-size:13px;word-break:break-all}

dialog{border:none;border-radius:20px;padding:0;width:min(520px,calc(100% - 20px));max-height:92vh;overflow:auto;background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
@media(max-width:600px){dialog{margin:auto 0 0;width:100%;max-width:100%;border-radius:20px 20px 0 0}}
dialog form{padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
dialog h2{margin:0;font-size:19px}
dialog.in h2{color:var(--in)}dialog.out h2{color:var(--out)}
#mvProd{margin:-8px 0 0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:10px;padding:10px 8px;font:600 14px system-ui;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qty{display:flex;gap:6px}.qty input{text-align:center;font-size:20px;font-weight:700}.qty .btn{width:54px;font-size:20px;flex:none}
.tot input{font-weight:700}

.overlay{position:fixed;inset:0;z-index:50;background:#000;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.overlay[hidden]{display:none}
.scan-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.scan-top .btn{color:#fff;border-color:#555}
#reader{flex:1;width:100%;overflow:hidden;border:none!important}
#reader video{object-fit:cover}
.scan-manual{display:flex;gap:8px;padding:12px 16px}
.scan-mode{padding:0 16px 10px;display:flex;flex-direction:column;gap:6px}
.scan-mode small{color:#bbb;font-size:12px;min-height:15px}
.seg.dark button{background:#1c1c1c;color:#ddd;border-color:#444}
.seg.dark button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scan-manual input{background:#1c1c1c;color:#fff;border-color:#444}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpis div{background:var(--surface2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.kpis b{font-size:20px}.kpis small{font-size:12px;color:var(--muted)}
.kpis .gain{background:var(--in-bg)}.kpis .gain b{color:var(--in)}
.tt{width:100%;border-collapse:collapse;font-size:14px}
.tt th,.tt td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tt th:first-child{text-align:left;font-weight:500;white-space:normal}
.tt thead th{font-size:12px;color:var(--muted);font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
  <a href="#/" class="brand">📦 <span id="title">Stock</span></a>
  <button id="syncBadge" class="badge off" type="button"><i></i><span>Local</span></button>
  <button id="btnSettings" class="iconbtn" type="button" aria-label="Paramètres" data-i18n-aria="Paramètres">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<main id="view"></main>

<nav class="bottombar">
  <button class="btn primary" id="btnScan" type="button">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10 8v8M13.5 8v8M17 8v8"/></svg>
    <span data-i18n>Scanner</span>
  </button>
  <button class="btn" id="btnNew" type="button">＋ <span data-i18n>Nouveau</span></button>
</nav>

<dialog id="infoDlg">
  <form method="dialog">
    <h2 id="infoTitle">Totaux</h2>
    <div id="infoBody" class="stack"></div>
    <button class="btn block" value="close" data-i18n>Fermer</button>
  </form>
</dialog>

<dialog id="mvDlg">
  <form id="mvForm" method="dialog">
    <h2 id="mvTitle">Mouvement</h2>
    <p id="mvProd" class="muted small"></p>
    <div class="seg" id="mvTypes"></div>

    <label><span data-i18n>Quantité</span>
      <span class="qty"><button type="button" class="btn" data-q="-1">−</button><input id="m_qty" inputmode="decimal" autocomplete="off"><button type="button" class="btn" data-q="1">+</button></span>
    </label>

      <label><span data-i18n>Prix unitaire HT</span><input id="m_uht" inputmode="decimal" autocomplete="off"></label>

<div id="scanOv" class="overlay" hidden>
  <div class="scan-top"><b data-i18n>Scanner un code-barres</b><button class="btn ghost" id="scanClose" type="button" data-i18n>Fermer</button></div>
  <div class="scan-mode" id="scanModeBox">
    <div class="seg dark" id="scanMode"><button type="button" data-m="open" data-i18n>Ouvrir la fiche</button><button type="button" data-m="quick" data-i18n>Sortie rapide (vente)</button></div>
    <small id="scanInfo"></small>
  </div>
  <div id="reader"></div>
  <form id="scanManual" class="scan-manual"><input id="scanInput" inputmode="numeric" placeholder="ou saisir le code…" data-i18n-ph="ou saisir le code…" autocomplete="off"><button class="btn primary">OK</button></form>
</div>

<div id="toast"></div>

<script>
'use strict';
/* ====== Constantes ====== */
const APP_VERSION = '20';
const FILE_NAME = 'gestion-stock-donnees.json';
const CATALOG_NAME = 'gestion-stock-catalogue.json';   // 2e fichier : vitrine publique (lecture seule, sans prix d'achat ni mouvements)
// Clé d'API Google (restreinte à « Google Drive API » et au site https://rkroman-86.github.io/*) :
// permet à la page publique catalogue.html de lire le fichier catalogue sans connexion Google.
const BUILTIN_API_KEY = 'AIzaSyCxjuKDSjKz8aRIRPw397A6dzzwcyeAkzk';
const SCOPE = 'https://www.googleapis.com/auth/drive.file';
// Client ID OAuth intégré : permet à tous les utilisateurs de connecter LEUR Google Drive sans configuration.
// Valable uniquement depuis l'adresse officielle (origine autorisée dans Google Cloud).
const BUILTIN_CLIENT_ID = '530939683660-tb54h39u61fjl1t3ahintjms1e12o4nv.apps.googleusercontent.com';
const BUILTIN_ORIGIN = 'https://rkroman-86.github.io';
const effectiveClientId = () => S.clientId || (location.origin === BUILTIN_ORIGIN ? BUILTIN_CLIENT_ID : '');
const effectiveApiKey = () => S.apiKey || (location.origin === BUILTIN_ORIGIN ? BUILTIN_API_KEY : '');
const SKEY = 'stock.settings', TKEY = 'stock.token';
const TYPES = {
  in:  { achat: 'Achat fournisseur', retour: 'Retour client', inventaire: 'Inventaire' },
  out: { vente: 'Vente', don: 'Don', inventaire: 'Inventaire' }
};
const TVA_RATES = [20, 10, 5.5, 2.1, 0];
const typeLabel = (dir, type) => tr((TYPES[dir] || {})[type] || type);
// Champ « taux de TVA » : liste des taux connus + « Autre taux… » avec saisie libre.
// L'input #id porte toujours la valeur (masqué quand un taux connu est choisi).
function vatField(id, value) {
  const v = +value || 0, known = TVA_RATES.includes(v);
  return `<span class="inline vat"><select id="${id}_sel">${TVA_RATES.map(r => `<option value="${r}"${known && v === r ? ' selected' : ''}>${fmtRate(r)} %</option>`).join('')}<option value="custom"${known ? '' : ' selected'}>${tr('Autre taux…')}</option></select><input id="${id}" inputmode="decimal" value="${fmtRate(v)}" placeholder="%" aria-label="${tr('Taux de TVA')} (%)"${known ? ' hidden' : ''}></span>`;
}
function bindVatField(id, onChange) {
  const sel = $('#' + id + '_sel'), inp = $('#' + id);
  inp.dataset.last = inp.value;
  const fire = () => { inp.dispatchEvent(new Event('change', { bubbles: true })); if (onChange) onChange(num(inp.value)); };
  sel.addEventListener('change', e => {
    e.stopPropagation();
    if (sel.value === 'custom') { inp.hidden = false; inp.focus(); inp.select(); return; }
    inp.hidden = true; inp.value = fmtRate(sel.value); inp.dataset.last = inp.value; fire();
  });
  inp.addEventListener('change', e => {
    const r = num(inp.value);
    if (inp.value.trim() === '' || r < 0 || r > 100) { e.stopImmediatePropagation(); toast(tr('Taux de TVA entre 0 et 100 %')); inp.value = inp.dataset.last || '0'; inp.focus(); return; }
    inp.value = fmtRate(r); inp.dataset.last = inp.value;
    if (TVA_RATES.includes(r)) { sel.value = String(r); inp.hidden = true; }
    if (e.isTrusted && onChange) onChange(r);

  get(k) { return new Promise((res, rej) => { const q = this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  set(k, v) { return new Promise((res, rej) => { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }

/* ====== Codes-barres ====== */
function ean13Check(d12) { let s = 0; for (let i = 0; i < 12; i++) s += (+d12[i]) * (i % 2 ? 3 : 1); return (10 - s % 10) % 10; }
const isEAN13 = c => /^\d{13}$/.test(c) && ean13Check(c.slice(0, 12)) === +c[12];
// Préfixe 20-29 = plage EAN réservée à l'usage interne (codes magasin)
function genCode() { let c; do { let d = '2' + Math.floor(Math.random() * 10); for (let i = 0; i < 10; i++) d += Math.floor(Math.random() * 10); c = d + ean13Check(d); } while (codeExists(c)); return c; }
function renderBarcode(code) {
  const svg = $('#bc'); if (!svg) return; svg.innerHTML = ''; if (!code || typeof JsBarcode === 'undefined') return;
  const o = { height: 70, width: 2, fontSize: 16, margin: 10, background: '#ffffff', lineColor: '#000000' };
  try { JsBarcode(svg, code, { ...o, format: isEAN13(code) ? 'EAN13' : 'CODE128' }); }
  catch { try { JsBarcode(svg, code, { ...o, format: 'CODE128' }); } catch {} }
}
/* ====== Étiquette image (universelle) ====== */
const PXMM = 12; // ≈ 300 dpi : net sur toutes les imprimantes thermiques (203 ou 300 dpi)
const LABEL_PRESETS = [['40x30', '40 × 30 mm'], ['50x30', '50 × 30 mm'], ['50x50', '50 × 50 mm'], ['30x20', '30 × 20 mm'], ['57x30', '57 × 30 mm (rouleau continu)'], ['57x40', '57 × 40 mm (rouleau continu)'], ['custom', 'Personnalisé']];
const labelCfg = () => Object.assign({ w: 40, h: 30, name: true, price: true, rotate: false }, S.label || {});
function wrapLines(ctx, text, maxW) {
  const lines = []; let cur = '';
  for (const w of String(text).split(/\s+/).filter(Boolean)) { const t = cur ? cur + ' ' + w : w; if (!cur || ctx.measureText(t).width <= maxW) cur = t; else { lines.push(cur); cur = w; } }
  if (cur) lines.push(cur); return lines;
}
function drawFitText(ctx, text, cx, y, maxW, maxH, maxLines, weight) {
  const font = s => `${weight} ${s}px system-ui,-apple-system,Roboto,Arial,sans-serif`;
  for (let s = Math.floor(maxH); s >= 10; s--) {
    ctx.font = font(s); const lines = wrapLines(ctx, text, maxW), lh = s * 1.12;
    if (lines.length <= maxLines && lines.length * lh <= maxH && lines.every(l => ctx.measureText(l).width <= maxW)) {
      const top = y + (maxH - lines.length * lh) / 2;
      lines.forEach((l, i) => ctx.fillText(l, cx, top + i * lh + s * 0.92)); return;
    }
  }
  ctx.font = font(10); let t = String(text); while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  ctx.fillText(t + '…', cx, y + maxH * 0.7);
}
function barcodeCanvas(code, maxW, maxH) {
  if (!code || typeof JsBarcode === 'undefined') return null;
  const fs = Math.max(14, Math.min(40, Math.round(maxH * 0.2)));
  const make = (fmt, mod, h) => { const c = document.createElement('canvas'); JsBarcode(c, code, { format: fmt, width: mod, height: h, displayValue: true, fontSize: fs, textMargin: 2, margin: 0, background: '#ffffff', lineColor: '#000000', font: 'monospace', fontOptions: 'bold' }); return c; };
  for (const fmt of (isEAN13(code) ? ['EAN13', 'CODE128'] : ['CODE128'])) {
    try {
      const probe = make(fmt, 1, 10);
      const mod = Math.max(1, Math.floor(maxW / probe.width));
      return make(fmt, mod, Math.max(10, maxH - fs - 4));
    } catch {}
  }

}
function labelCanvas(p, cfg = labelCfg()) {
  const W = Math.round(cfg.w * PXMM), H = Math.round(cfg.h * PXMM);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.fillStyle = '#000'; x.textAlign = 'center';
  const pad = Math.round(1.5 * PXMM), gap = Math.round(0.6 * PXMM), iw = W - 2 * pad, ih = H - 2 * pad;
  let top = pad, bottom = H - pad;
  if (cfg.name) { const nh = Math.round(ih * 0.26); drawFitText(x, p.name || '', W / 2, top, iw, nh, 2, '700'); top += nh + gap; }
  if (cfg.price) { const ph = Math.round(ih * 0.2); drawFitText(x, `${eur(ttc(p.sellHT, p.tva))} ${TTC()}`, W / 2, bottom - ph, iw, ph, 1, '800'); bottom -= ph + gap; }
  const bh = bottom - top, bc = barcodeCanvas(p.code, iw, bh);
  if (bc) { const dh = Math.min(bc.height, bh), dw = Math.min(bc.width, iw); x.drawImage(bc, Math.round((W - dw) / 2), Math.round(top + (bh - dh) / 2), dw, dh); }
  else drawFitText(x, p.code || '', W / 2, top, iw, bh, 1, '700');

  const r = document.createElement('canvas'); r.width = H; r.height = W;
  const rx = r.getContext('2d'); rx.translate(H, 0); rx.rotate(Math.PI / 2); rx.drawImage(c, 0, 0);
  return r;
}
const labelName = p => `${tr('etiquette')}-${(p.code || tr('produit')).replace(/[^\w-]/g, '')}.png`;
const labelBlob = p => new Promise(res => labelCanvas(p).toBlob(res, 'image/png'));

function resizeImage(file, max = 640, q = 0.72) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}

const listState = { q: '', filter: 'all' };
function viewList() {
  setTitle('Stock');
  const sm = stockMap(), prods = activeProducts();
  let units = 0, val = 0, low = 0;
  for (const p of prods) { const s = sm[p.id] || 0; units += Math.max(s, 0); val += Math.max(s, 0) * (+p.buyHT || 0); if (s <= (+p.minStock || 0)) low++; }
  view.innerHTML = `
    <div class="summary">
      <div><b>${prods.length}</b><span>${tr('produits')}</span></div>
      <div><b>${fmtNum(units)}</b><span>${tr('unités en stock')}</span></div>

    <div class="chips">${[['all', tr('Tous')], ['low', tr('Stock bas') + (low ? ' · ' + low : '')], ['zero', tr('Rupture')]].map(([k, l]) => `<button class="chip${listState.filter === k ? ' on' : ''}" data-f="${k}">${l}</button>`).join('')}</div>
    <div id="grid" class="grid"></div>`;
  $('#q').addEventListener('input', e => { listState.q = e.target.value; renderGrid(); });
  $$('.chip').forEach(b => b.onclick = () => { listState.filter = b.dataset.f; $$('.chip').forEach(x => x.classList.toggle('on', x === b)); renderGrid(); });
  $('#grid').onclick = e => {
    const card = e.target.closest('.card'); if (!card) return;
    const act = e.target.closest('[data-act]');
    if (act) openMove(card.dataset.id, act.dataset.act); else location.hash = '#/p/' + card.dataset.id;
  };

}
function renderGrid() {
  const g = $('#grid'); if (!g) return;
  const sm = stockMap(), q = listState.q.trim().toLowerCase();
  let prods = activeProducts().filter(p => !q || (p.name || '').toLowerCase().includes(q) || (p.code || '').includes(q));
  if (listState.filter === 'low') prods = prods.filter(p => (sm[p.id] || 0) <= (+p.minStock || 0));
  if (listState.filter === 'zero') prods = prods.filter(p => (sm[p.id] || 0) <= 0);

    <article class="card" data-id="${p.id}">

function bindForm(p, isNew, onSave) {
  const v = { buyHT: +p.buyHT || 0, sellHT: +p.sellHT || 0 };
  const tva = () => num($('#f_tva').value);
  const showMargin = () => {
    const m = v.sellHT - v.buyHT;
    $('#margin').textContent = v.sellHT > 0 ? tr('Marge : {m} HT · taux de marque {r} %', { m: eur(m), r: fmtNum(Math.round(m / v.sellHT * 1000) / 10) }) + (v.buyHT > 0 ? ' · ' + tr('coef') + ' ×' + fmtNum(Math.round(v.sellHT / v.buyHT * 100) / 100) : '') : '';
  };
  const sync = (k, src) => {
    const h = $('#f_' + k + 'HT'), t = $('#f_' + k + 'TTC');
    if (src === 'ht') v[k + 'HT'] = num(h.value);
    else if (src === 'ttc') v[k + 'HT'] = htFrom(num(t.value), tva());
    if (src !== 'ht') h.value = fx2(v[k + 'HT']);
    if (src !== 'ttc') t.value = fx2(ttc(v[k + 'HT'], tva()));
    showMargin();
  };
  ['buy', 'sell'].forEach(k => {
    $('#f_' + k + 'HT').addEventListener('input', () => sync(k, 'ht'));
    $('#f_' + k + 'TTC').addEventListener('input', () => sync(k, 'ttc'));
  });
  bindVatField('f_tva');
  $('#f_tva').addEventListener('change', () => { sync('buy', 'tva'); sync('sell', 'tva'); });
  showMargin();
  if (!isNew && onSave) $('#pform').addEventListener('change', e => { if (e.target.id !== 'f_init') onSave(); });

  const target = () => isNew ? p : (DB.products[p.id] || p);
  const setPhoto = data => { const t = target(); t.photo = data; $('#photo').innerHTML = photoInner(t); $('#rmPhoto').hidden = !data; if (!isNew) { t.updatedAt = nowISO(); touch(); } };
  const onFile = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { setPhoto(await resizeImage(f)); } catch { toast(tr('Image illisible')); } };
  $('#takePhoto').onclick = () => $('#camIn').click();
  $('#pickPhoto').onclick = () => $('#galIn').click();
  $('#camIn').onchange = onFile; $('#galIn').onchange = onFile;
  $('#rmPhoto').onclick = () => { if (confirm(tr('Retirer la photo ?'))) setPhoto(null); };

  $('#scanCode').onclick = () => openScanner(setCode);

  return () => ({
    name: $('#f_name').value.trim(), code: $('#f_code').value.trim(), tva: tva(),
    buyHT: v.buyHT, sellHT: v.sellHT, minStock: num($('#f_min').value), note: $('#f_note').value.trim()
  });
}

function viewNew(code) {
  if (code) { const ex = findByCode(code); if (ex) { location.replace('#/p/' + ex.id); return; } }
  setTitle(tr('Nouveau produit'));
  const d = { id: uid(), code: code || genCode(), name: '', photo: null, tva: +S.tva || 0, buyHT: 0, sellHT: 0, minStock: 0, note: '' };
  view.innerHTML = `<a class="back" href="#/">← ${tr('Retour')}</a>
    <section class="panel"><h2>${tr('Nouveau produit')}</h2>${productForm(d, true)}
      <div class="bc-box"><svg id="bc"></svg></div>
      <button class="btn primary block big" id="create" type="button">${tr('Créer le produit')}</button>
    </section>`;
  const read = bindForm(d, true);
  renderBarcode(d.code);
  $('#f_code').addEventListener('change', () => renderBarcode($('#f_code').value.trim()));
  if (!code) setTimeout(() => $('#f_name').focus(), 50);
  $('#create').onclick = () => {
    const f = read();
    if (!f.name) { toast(tr('Indiquez un nom')); $('#f_name').focus(); return; }
    if (!f.code) { toast(tr('Code-barres requis')); return; }
    if (codeExists(f.code)) { toast(tr('Ce code-barres existe déjà')); return; }

/* ====== Google Drive ====== */
let accessToken = null, tokenExp = 0, syncing = false, syncTimer = null, syncState = 'idle', syncErr = '';

  return new Promise((res, rej) => {
    if (window.google && google.accounts && google.accounts.oauth2) return res();
    let n = 0; const t = setInterval(() => { if (window.google && google.accounts && google.accounts.oauth2) { clearInterval(t); res(); } else if (++n > 50) { clearInterval(t); rej(new Error(tr('Service Google inaccessible (connexion internet ?)'))); } }, 100);
  });
}

  if (!effectiveClientId()) throw new Error(tr('Synchronisation Google Drive pas encore disponible : renseignez un Client ID (Paramètres → options avancées)'));

      client_id: tokenClientId, scope: SCOPE,
      callback: r => {
        if (r.error) { tokenReject && tokenReject(new Error(r.error_description || r.error)); return; }

        localStorage.setItem(TKEY, JSON.stringify({ t: accessToken, e: tokenExp }));
        tokenResolve && tokenResolve(accessToken);
      },
      error_callback: e => tokenReject && tokenReject(new Error(e.type === 'popup_closed' ? tr('Fenêtre Google fermée') : e.type === 'popup_failed_to_open' ? tr('Fenêtre Google bloquée par le navigateur') : (e.message || e.type || tr('Erreur Google'))))
    });
  }

    .finally(() => { tokenPending = tokenResolve = tokenReject = null; });
  // Déjà autorisé : pas d'écran de consentement ; login_hint évite le choix du compte
  const opts = { prompt: S.driveOn ? '' : 'consent' };
  if (S.driveOn && S.email) opts.login_hint = S.email;
  tokenClient.requestAccessToken(opts);
  // Google ne répond pas (mauvaise connexion) : on abandonne au bout de 20 s, nouvel essai plus tard
  const p = tokenPending;

// Mémorise le compte Google utilisé (pour renouveler l'accès sans choisir le compte)

}
// Renouvellement automatique : au premier geste de l'utilisateur quand l'accès a expiré (ou va expirer),
// la fenêtre Google s'ouvre et se referme seule, puis la synchro reprend.
const NEAR_EXPIRY = 10 * 60 * 1000;
function needsRenewal() {

  if (Date.now() - lastRenewFail < 120000) return false;
  if (accessToken && Date.now() < tokenExp - NEAR_EXPIRY) return false;
  // Seulement quand c'est utile : modifications à envoyer, ou dernière synchro de plus de 5 min (récupérer celles des autres appareils)
  return S.dirty || !S.lastSync || Date.now() - new Date(S.lastSync).getTime() > 5 * 60000;
}
function onUserGesture(e) {

  const t = e.target;
  if (t.closest('#syncBadge, #s_conn, #s_sync')) return;           // ces boutons gèrent déjà la connexion
  // Boutons qui ouvrent le sélecteur de fichiers, la caméra, le partage ou l'impression : ne pas leur voler le geste
  if (t.closest('#c_share, #c_copy, #c_qrShare, #s_imp, #s_csv1, #s_csv2, #s_exp, #takePhoto, #pickPhoto, #rmPhoto, #btnScan, #scanCode, #shareLbl, #dlLbl, #print, #infoCsv, [type=file]')) return;

  getToken(true).then(() => { syncState = 'idle'; syncErr = ''; updateBadge(); if (!syncing) syncNow(false); })
    .catch(() => { lastRenewFail = Date.now(); updateBadge(); });

// Fusionne les produits en double (même code-barres, identifiants différents) :
// on garde la fiche la plus complète (photo, vrai historique, la plus ancienne),

  const realMoves = id => moves.filter(m => m.productId === id && m.note !== 'Import CSV').length;
  const t = nowISO(); let n = 0;
  for (const list of Object.values(groups)) {
    if (list.length < 2) continue;
    list.sort((a, b) => (!!b.photo - !!a.photo) || (realMoves(b.id) - realMoves(a.id)) || String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
    const keep = list[0];

      const keepHasReal = realMoves(keep.id) > 0;
      for (const m of moves) if (m.productId === dup.id) {
        if (m.note === 'Import CSV' && keepHasReal) Object.assign(m, { deleted: true, updatedAt: t });

async function publishCatalog() {

      if (S.catalogId && S.catalogShared) {
        const r = await api(`${base}/${S.catalogId}/permissions/anyoneWithLink`, { method: 'DELETE' });
        if (r.ok || r.status === 404) { S.catalogShared = false; S.catalogHash = ''; saveS(); }

    }
    const data = await buildCatalog();
    const sig = hashStr(JSON.stringify(data));
    let id = S.catalogId;
    if (!id) {
      const q = encodeURIComponent(`name='${CATALOG_NAME}' and trashed=false`);
      const r = await api(`${base}?q=${q}&spaces=drive&orderBy=modifiedTime%20desc&fields=files(id)`);
      if (r.ok) { const j = await r.json(); id = (j.files && j.files[0] && j.files[0].id) || null; }

      const r = await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + bd }, body: mp });

    }
    if (!S.catalogShared) {
      const r = await api(`${base}/${id}/permissions`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ role: 'reader', type: 'anyone' }) });

  finally {
    const st = $('#c_stat'); if (st) st.innerHTML = catStatusHTML();

    if (st && !isEditing() && !!$('#c_url') !== !!(catCfg().on && S.catalogId)) viewSettings();
  }
}

function moveTotals(list) {

  for (const dir of ['in', 'out']) for (const k in TYPES[dir]) T.types[dir + '.' + k] = { dir, label: typeLabel(dir, k), q: 0, ht: 0, ttc: 0 };

function exportComptaCSV(from, to) {
  const list = movesInRange(from, to);

  const dfr = d => d.split('-').reverse().join('/');  // jj/mm/aaaa (FR et EN-GB)

  const pname = m => (DB.products[m.productId] || {}).name || '?';

  // A. Par jour et par taux

    const k = day(m) + '|' + (+m.tva || 0), o = byDay[k] = byDay[k] || { d: day(m), r: +m.tva || 0, q: 0, v: 0, ret: 0 };

  const byRate = {};
  for (const o of Object.values(byDay).sort((a, b) => a.d.localeCompare(b.d) || a.r - b.r)) {
    const net = o.v - o.ret, tva = net * o.r / 100;
    rows.push([dfr(o.d), dec(o.r), fmtNum(o.q), dec(o.v), o.ret ? '-' + dec(o.ret) : dec(0), dec(net), dec(tva), dec(net + tva)]);
    const R = byRate[o.r] = byRate[o.r] || { q: 0, v: 0, ret: 0 }; R.q += o.q; R.v += o.v; R.ret += o.ret;
  }

    if (!isSale(m) && !isRet(m)) continue;
    const ref = m.note || tr('(sans référence)'), o = byRef[ref] = byRef[ref] || { d: day(m), q: 0, ht: 0, tva: 0, items: {} };
    const sg = isSale(m) ? 1 : -1, ht = sg * m.unitHT * m.qty;

    o.items[pname(m)] = (o.items[pname(m)] || 0) + sg * m.qty;
  }
  rows.push([tr('VENTES PAR RÉFÉRENCE (N° DE COMMANDE)')]);
  rows.push(['Date', 'Référence', 'Articles', 'Total HT', 'TVA', 'Total TTC', 'Détail'].map(h => tr(h)));
  for (const [ref, o] of Object.entries(byRef).sort((a, b) => a[1].d.localeCompare(b[1].d) || a[0].localeCompare(b[0], 'fr')))
    rows.push([dfr(o.d), ref, fmtNum(o.q), dec(o.ht), dec(o.tva), dec(o.ht + o.tva), Object.entries(o.items).map(([n, q]) => `${fmtNum(q)} × ${n}`).join(' ; ')]);
  if (!Object.keys(byRef).length) rows.push(['—']);
  rows.push([]);
  // C. Dons

  rows.push([tr('DONS (valorisés au prix d\'achat HT)')]);
  rows.push(['Date', 'Produit', 'Quantité', 'Valeur HT', 'Référence / note'].map(h => tr(h)));
  let donsHT = 0;
  for (const m of dons) { const v = m.qty * (+(DB.products[m.productId] || {}).buyHT || 0); donsHT += v; rows.push([dfr(day(m)), pname(m), fmtNum(m.qty), dec(v), m.note || '']); }

  rows.push([tr('TOTAUX DE LA PÉRIODE PAR TAUX DE TVA')]);
  rows.push(['Taux TVA %', 'Articles vendus', 'Ventes HT', 'Retours HT', 'Net HT', 'TVA collectée', 'Net TTC'].map(h => tr(h)));
  const tot = { q: 0, v: 0, ret: 0, tva: 0 };
  for (const [r, R] of Object.entries(byRate).sort((a, b) => a[0] - b[0])) {

    rows.push([dec(r), fmtNum(R.q), dec(R.v), R.ret ? '-' + dec(R.ret) : dec(0), dec(net), dec(tva), dec(net + tva)]);

  rows.push([tr('TOTAL'), fmtNum(tot.q), dec(tot.v), tot.ret ? '-' + dec(tot.ret) : dec(0), dec(tot.v - tot.ret), dec(tot.tva), dec(tot.v - tot.ret + tot.tva)]);

  rows.push([]);
  rows.push([tr('Coût d\'achat des articles vendus (HT)'), dec(T.coutHT)]);

  download(`${tr('recap-comptable')}-${suffix}.csv`, toCSV(rows), 'text/csv;charset=utf-8');

function periodRange(k) {

    case '7d': { const a = new Date(day); a.setDate(a.getDate() - 6); return [a, null]; }
    case 'month': return [new Date(n.getFullYear(), n.getMonth(), 1), null];
    case 'lastmonth': return [new Date(n.getFullYear(), n.getMonth() - 1, 1), new Date(n.getFullYear(), n.getMonth(), 1)];
    case 'year': return [new Date(n.getFullYear(), 0, 1), null];

    }

  }
}

function importBackup(j, replace) {
  const t = nowISO(), rp = j.products || {}, rm = j.movements || {};
  if (replace) {
    // Les données actuelles sont marquées supprimées et la sauvegarde reçoit une date récente,
    // pour qu'elle l'emporte aussi lors de la synchronisation avec Google Drive.
    for (const p of Object.values(DB.products)) if (!rp[p.id] && !p.deleted) Object.assign(p, { deleted: true, photo: null, updatedAt: t });
    for (const m of Object.values(DB.movements)) if (!rm[m.id] && !m.deleted) Object.assign(m, { deleted: true, updatedAt: t });
    for (const p of Object.values(rp)) DB.products[p.id] = { ...p, updatedAt: t };
    for (const m of Object.values(rm)) DB.movements[m.id] = { ...m, updatedAt: t };
    touch(); toast(tr('Sauvegarde restaurée : {n} produit(s)', { n: Object.values(rp).filter(p => !p.deleted).length }));
  } else {
    let a, b, ph = 0;
    [DB.products, a] = mergeColl(DB.products, rp); [DB.movements, b] = mergeColl(DB.movements, rm);
    // Photo manquante sur l'appareil mais présente dans la sauvegarde : on la reprend toujours
    for (const r of Object.values(rp)) { const l = DB.products[r.id]; if (r.photo && l && !l.photo && !l.deleted) { l.photo = r.photo; l.updatedAt = t; ph++; } }
    const d = dedupeByCode();
    touch(); toast(tr('Import : {n} élément(s) fusionné(s)', { n: a + b }) + (ph ? ' · ' + tr('{n} photo(s) récupérée(s)', { n: ph }) : '') + (d ? ' · ' + tr('{n} doublon(s) regroupé(s)', { n: d }) : ''));
  }
  location.hash = '#/';
}

/* ====== Import CSV de stock ====== */
function parseCSV(text) {
  const first = text.split(/\r?\n/).find(l => l.trim()) || '';
  const count = c => (first.match(new RegExp('\\' + c, 'g')) || []).length;
  const sep = [';', '\t', ','].sort((a, b) => count(b) - count(a))[0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(c => c));
}
const normH = h => h.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const CSV_COLS = {
  code: ['code', 'code barre', 'code barres', 'code a barres', 'codebarre', 'codebarres', 'ean', 'ean13', 'ean 13', 'barcode', 'gtin', 'reference', 'ref', 'sku', 'upc'],
  name: ['nom', 'produit', 'nom du produit', 'designation', 'libelle', 'article', 'name', 'description', 'product', 'product name', 'item', 'item name', 'title'],
  qty: ['stock', 'quantite', 'qte', 'qty', 'quantite en stock', 'stock actuel', 'en stock', 'quantity', 'on hand', 'in stock', 'stock qty', 'stock quantity'],
  tva: ['tva', 'taux tva', 'taux de tva', 'tva %', 'vat', 'vat rate', 'tax', 'tax rate'],
  buyHT: ['achat ht', 'prix achat ht', 'prix d achat ht', 'pa ht', 'prix achat', 'prix d achat', 'cout ht', 'cout', 'purchase excl vat', 'purchase price excl vat', 'purchase price', 'cost', 'cost price', 'buy price', 'unit cost'],
  buyTTC: ['achat ttc', 'prix achat ttc', 'prix d achat ttc', 'pa ttc', 'purchase incl vat', 'purchase price incl vat'],
  sellHT: ['vente ht', 'prix vente ht', 'prix de vente ht', 'pv ht', 'sale excl vat', 'sale price excl vat', 'price excl vat', 'net price'],
  sellTTC: ['vente ttc', 'prix vente ttc', 'prix de vente ttc', 'pv ttc', 'prix ttc', 'prix vente', 'prix de vente', 'prix', 'sale incl vat', 'sale price incl vat', 'price incl vat', 'sale price', 'selling price', 'retail price', 'price'],
  min: ['seuil', 'seuil alerte', 'seuil d alerte', 'stock min', 'stock minimum', 'alerte', 'alert threshold', 'min stock', 'minimum stock', 'reorder level', 'reorder point']
};
function importStockCSV(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) { toast(tr('Fichier CSV vide ou illisible')); return; }
  const head = rows[0].map(normH), col = {};
  for (const [k, names] of Object.entries(CSV_COLS)) { const i = head.findIndex(h => names.includes(h)); if (i >= 0) col[k] = i; }
  if (col.name === undefined && col.code === undefined) { toast(tr('Colonnes introuvables : il faut au moins « Nom » ou « Code » en première ligne'), 5000); return; }
  const cell = (r, k) => col[k] === undefined ? '' : (r[col[k]] || '');
  const has = (r, k) => cell(r, k) !== '';
  const sm = stockMap(), seen = new Set(), plan = [];
  let sciCodes = 0;
  for (const r of rows.slice(1)) {
    const name = cell(r, 'name'); let code = cell(r, 'code').replace(/\s/g, '');
    if (/^(total|marge|potential margin)/i.test(r[0] || '') || (!name && !code)) continue;
    if (/^\d+(,\d+)?e\+\d+$/i.test(code)) { sciCodes++; continue; }
    if (code && seen.has(code)) continue; if (code) seen.add(code);
    const ex = code ? findByCode(code) : (activeProducts().find(p => p.name.toLowerCase() === name.toLowerCase()));
    if (!ex && !name) continue;
    const tva = has(r, 'tva') ? num(cell(r, 'tva')) : ex ? +ex.tva : +S.tva;
    const priceHT = (h, t) => has(r, h) ? num(cell(r, h)) : has(r, t) ? htFrom(num(cell(r, t)), tva) : null;
    plan.push({ ex, code, name, tva, buyHT: priceHT('buyHT', 'buyTTC'), sellHT: priceHT('sellHT', 'sellTTC'),
      min: has(r, 'min') ? num(cell(r, 'min')) : null, qty: has(r, 'qty') ? num(cell(r, 'qty')) : null });
  }
  if (!plan.length) { toast(sciCodes ? tr('Codes-barres abîmés par Excel (format 2,00E+12) : mettez la colonne Code au format Texte') : tr('Aucun produit trouvé dans le fichier'), 5000); return; }
  const nNew = plan.filter(x => !x.ex).length, nUpd = plan.length - nNew;
  const nAdj = plan.filter(x => x.qty !== null && x.qty !== (x.ex ? (sm[x.ex.id] || 0) : 0)).length;
  let msg = tr('Import CSV :\n• {a} nouveau(x) produit(s)\n• {b} produit(s) existant(s) mis à jour\n• {c} ajustement(s) de stock (mouvement « Inventaire »)', { a: nNew, b: nUpd, c: nAdj });
  if (sciCodes) msg += '\n\n⚠️ ' + tr('{n} ligne(s) ignorée(s) : code-barres abîmé par Excel (2,00E+12).', { n: sciCodes });
  if (!confirm(msg + '\n\n' + tr('Continuer ?'))) return;
  const t = nowISO();
  for (const x of plan) {
    let p = x.ex;
    if (!p) {
      let code = x.code; if (!code || codeExists(code)) code = genCode();
      p = { id: uid(), code, name: x.name, photo: null, tva: x.tva, buyHT: x.buyHT || 0, sellHT: x.sellHT || 0, minStock: x.min || 0, note: '', createdAt: t, updatedAt: t, deleted: false };
      DB.products[p.id] = p;
    } else {
      if (x.name) p.name = x.name; p.tva = x.tva;
      if (x.buyHT !== null) p.buyHT = x.buyHT; if (x.sellHT !== null) p.sellHT = x.sellHT; if (x.min !== null) p.minStock = x.min;
      p.updatedAt = t;
    }
    if (x.qty !== null) {
      const diff = x.qty - (x.ex ? (sm[p.id] || 0) : 0);
      if (diff) { const id = uid(); DB.movements[id] = { id, productId: p.id, dir: diff > 0 ? 'in' : 'out', type: 'inventaire', date: t, qty: Math.abs(diff), unitHT: +p.buyHT || 0, tva: +p.tva || 0, note: 'Import CSV', createdAt: t, updatedAt: t, deleted: false }; }
    }
  }
  touch(); toast(tr('Import terminé : {n} produit(s)', { n: plan.length })); location.hash = '#/';
}

        <li>${tr('Collez l\'ID client ci-dessus, puis touchez <b>Connecter Google Drive</b>.')}</li>
      </ol>
      <label>${tr('Clé d\'API Google (catalogue public)')}<input id="s_key" value="${esc(S.apiKey || '')}" placeholder="AIza…" autocomplete="off" spellcheck="false"></label>
      <p class="small">${tr('Seulement pour le catalogue public avec votre propre projet : <b>Identifiants → Créer → Clé API</b>, limitée à <b>Google Drive API</b> et aux sites <code>{o}/*</code>.', { o: origin ? esc(origin) : 'https://…' })}</p>
    </details>
  </section>
  <section class="panel"><h2>🛍️ ${tr('Catalogue public (vitrine)')}</h2><div class="form">
    <p class="muted small" style="margin:0">${tr('Un 2e fichier <code>{f}</code> est publié dans votre Drive, lisible par tous via un lien : nom, photo, code-barres, quantité disponible et prix de vente. Vos clients voient le stock et vous envoient leur demande sur WhatsApp — pas d\'achat en ligne. Les prix d\'achat et les mouvements ne sont jamais publiés.', { f: CATALOG_NAME })}</p>
    <label class="check"><input type="checkbox" id="c_on"${catCfg().on ? ' checked' : ''}> ${tr('Publier le catalogue public')}</label>
    <label>${tr('Nom de la boutique')}<input id="c_shop" value="${esc(catCfg().shop)}" placeholder="${tr('Ma boutique')}" autocomplete="off"></label>
    <label>${tr('Numéro WhatsApp qui reçoit les demandes')}<input id="c_phone" type="tel" value="${esc(catCfg().phone)}" placeholder="+33 6 12 34 56 78" autocomplete="off"></label>
    <label class="check"><input type="checkbox" id="c_out"${catCfg().showOut ? ' checked' : ''}> ${tr('Afficher aussi les produits en rupture')}</label>
    <label class="check"><input type="checkbox" id="c_ht"${catCfg().showHT !== false ? ' checked' : ''}> ${tr('Afficher le prix HT en plus du TTC')}</label>
    <div class="status" id="c_stat">${catStatusHTML()}</div>
    ${catCfg().on && S.catalogId ? `<input id="c_url" readonly value="${esc(catalogURL())}" onclick="this.select()">
    <div class="row3"><button class="btn primary" id="c_share" type="button">${tr('Partager')}</button><button class="btn" id="c_copy" type="button">${tr('Copier le lien')}</button><a class="btn" href="${esc(catalogURL())}" target="_blank" rel="noopener">${tr('Ouvrir')}</a></div>
    <div class="qr-box"><img id="c_qr" alt="QR code"><p class="muted small" style="margin:6px 0 0">${tr('QR code à afficher en boutique ou sur une carte de visite : vos clients le scannent pour ouvrir le catalogue et l\'installer.')}</p></div>
    <button class="btn block" id="c_qrShare" type="button">🖼️ ${tr('Partager / enregistrer le QR code (pour l\'imprimer)')}</button>` : ''}
  </div></section>
  <section class="panel"><h2>${tr('Général')}</h2>
    <label>${tr('TVA par défaut des nouveaux produits')}${vatField('s_tva', S.tva)}</label>
  </section>
  <section class="panel"><h2>${tr('Étiquettes')}</h2><div class="form">
    <label>${tr('Format des étiquettes')}<select id="l_preset">${LABEL_PRESETS.map(([k, l]) => `<option value="${k}">${tr(l)}</option>`).join('')}</select></label>
    <div class="pair"><label>${tr('Largeur (mm)')}<input id="l_w" inputmode="decimal"></label><label>${tr('Hauteur (mm)')}<input id="l_h" inputmode="decimal"></label></div>
    <label class="check"><input type="checkbox" id="l_name"> ${tr('Afficher le nom du produit')}</label>
    <label class="check"><input type="checkbox" id="l_price"> ${tr('Afficher le prix de vente TTC')}</label>
    <label class="check"><input type="checkbox" id="l_rot"> ${tr('Pivoter de 90° (si l\'appli de l\'imprimante l\'imprime de travers)')}</label>
    <div class="bc-box lbl"><img id="l_prev" alt="${tr('Aperçu')}"></div>
  </div></section>
  <section class="panel"><h2>${tr('Totaux')}</h2><div class="stack">
    <button class="btn primary block" id="s_tot1" type="button">📦 ${tr('Totaux du stock (valeur d\'achat et vénale)')}</button>
    <button class="btn primary block" id="s_tot2" type="button">💶 ${tr('Totaux des mouvements (ventes et gains)')}</button>
  </div></section>
  <section class="panel"><h2>${tr('Exports & sauvegarde')}</h2><div class="stack">
    <button class="btn block" id="s_csv1" type="button">📄 ${tr('État du stock (CSV / Excel)')}</button>
    <button class="btn primary block" id="s_compta" type="button">📒 ${tr('Récapitulatif comptable du jour…')}</button>
    <button class="btn block" id="s_csv2" type="button">📄 ${tr('Journal des mouvements (CSV / Excel)')}</button>
    <button class="btn block" id="s_exp" type="button">💾 ${tr('Sauvegarde complète (JSON)')}</button>
    <button class="btn block" id="s_imp" type="button">📥 ${tr('Importer (sauvegarde JSON ou liste de stock CSV)')}</button>
    <input type="file" id="s_impIn" hidden>
    <p class="muted small" style="margin:0">${tr('CSV : une ligne par produit avec des colonnes comme <i>Code, Nom, Stock, TVA, Achat HT, Vente TTC, Seuil alerte</i> (l\'export « État du stock » convient). Depuis Excel : <b>Enregistrer sous → CSV</b>. Les produits existants (même code) sont mis à jour et leur stock est ajusté par un mouvement « Inventaire ».')}</p>
  </div></section>
  <section class="panel"><h2>${tr('Cet appareil')}</h2>
    <p class="muted small" style="margin-top:0">${tr('Efface les données locales. Si Drive est connecté, elles reviendront à la prochaine synchronisation.')}</p>
    <button class="btn danger block" id="s_reset" type="button">${tr('Effacer les données de cet appareil')}</button>
  </section>
  <p class="muted small" style="text-align:center">Version ${APP_VERSION} · <a href="#" id="s_upd">${tr('Rechercher une mise à jour')}</a></p>`;
  $('#s_lang').onclick = e => {
    const b = e.target.closest('[data-l]'); if (!b || b.dataset.l === S.lang) return;
    S.lang = b.dataset.l; saveS(); applyStatic(); updateBadge(); viewSettings();
  };
  $('#s_cid').addEventListener('change', e => { S.clientId = e.target.value.trim(); saveS(); });
  $('#s_key').addEventListener('change', e => { S.apiKey = e.target.value.trim(); saveS(); viewSettings(); });
  // Catalogue public
  const catSync = () => { if (S.driveOn && !S.autoSync) syncNow(false); };   // sinon la synchro automatique s'en charge
  $('#c_on').onchange = e => {
    if (e.target.checked && !S.driveOn) toast(tr('Connectez Google Drive pour publier le catalogue'), 4000);
    setCat({ on: e.target.checked }); viewSettings(); catSync();
  };
  $('#c_shop').addEventListener('change', e => { setCat({ shop: e.target.value.trim() }); catSync(); });
  $('#c_phone').addEventListener('change', e => {
    const v = e.target.value.trim();
    if (v && waDigits(v).length < 8) { toast(tr('Numéro WhatsApp invalide : indiquez-le au format international (+33…)'), 4000); return; }
    setCat({ phone: v }); catSync();
  });
  $('#c_out').onchange = e => { setCat({ showOut: e.target.checked }); catSync(); };
  $('#c_ht').onchange = e => { setCat({ showHT: e.target.checked }); catSync(); };
  if ($('#c_qr')) { const qc = catalogQR(); if (qc) $('#c_qr').src = qc.toDataURL('image/png'); else $('#c_qr').closest('.qr-box').hidden = true; }
  if ($('#c_copy')) $('#c_copy').onclick = async () => {
    try { await navigator.clipboard.writeText(catalogURL()); toast(tr('Lien copié')); }
    catch { const i = $('#c_url'); i.focus(); i.select(); try { document.execCommand('copy'); toast(tr('Lien copié')); } catch {} }
  };
  if ($('#c_qrShare')) $('#c_qrShare').onclick = async () => {
    const qc = catalogQR(); if (!qc) return;
    const blob = await new Promise(r => qc.toBlob(r, 'image/png'));
    const name = (catCfg().shop || tr('catalogue')).replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '') + '-qr.png';
    const file = new File([blob], name, { type: 'image/png' });
    try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: catCfg().shop || tr('Catalogue') }); return; } } catch (e) { if (e.name === 'AbortError') return; }
    download(name, blob, 'image/png');
  };
  if ($('#c_share')) $('#c_share').onclick = async () => {
    const url = catalogURL(), title = catCfg().shop || tr('Catalogue');
    try { if (navigator.share) { await navigator.share({ title, url }); return; } } catch (e) { if (e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url); toast(tr('Lien copié')); } catch { $('#c_url').select(); }
  };
  $('#s_conn').onclick = async () => {
    S.clientId = $('#s_cid').value.trim(); saveS();
    if (!effectiveClientId()) { toast(tr('Connexion intégrée pas encore disponible : collez un Client ID dans les options avancées'), 4500); return; }
    if (!origin || !window.isSecureContext) { toast(tr('Ouvrez l\'appli via une adresse https:// pour connecter Drive'), 4000); return; }
    try { accessToken = null; tokenExp = 0; await getToken(true); S.driveOn = true; saveS(); await syncNow(true); viewSettings(); }
    catch (e) { toast(e.message, 4000); updateBadge(); }
  };
  $('#s_sync').onclick = () => { if (!S.driveOn) { toast(tr('Connectez d\'abord Google Drive')); return; } syncNow(true); };
  $('#s_auto').onchange = e => { S.autoSync = e.target.checked; saveS(); scheduleSync(); };
  if ($('#s_disc')) $('#s_disc').onclick = () => {
    if (!confirm(tr('Déconnecter Google Drive ?\nLes données restent sur cet appareil et dans Drive.'))) return;
    try { if (accessToken && window.google && google.accounts) google.accounts.oauth2.revoke(accessToken, () => {}); } catch {}
    accessToken = null; tokenExp = 0; localStorage.removeItem(TKEY); S.driveOn = false; S.fileId = null; S.email = ''; S.catalogId = null; S.catalogShared = false; S.catalogHash = ''; saveS(); updateBadge(); viewSettings(); toast(tr('Déconnecté'));
  };
  bindVatField('s_tva', r => { S.tva = r; saveS(); });
  $('#s_csv1').onclick = exportStockCSV;
  $('#s_csv2').onclick = () => exportMovesCSV();
  bindLabelSettings();
  $('#s_tot1').onclick = showStockTotals;
  $('#s_tot2').onclick = showMoveTotals;
  $('#s_compta').onclick = () => { movePeriod = 'today'; showMoveTotals(); };
  $('#s_exp').onclick = () => download(`${tr('stock-sauvegarde')}-${today()}.json`, JSON.stringify({ app: 'gestion-stock', version: 1, savedAt: nowISO(), products: DB.products, movements: DB.movements, config: DB.config || {} }), 'application/json');
  $('#s_imp').onclick = () => $('#s_impIn').click();
  $('#s_impIn').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    if (/\.(xlsx?|ods|numbers)$/i.test(f.name)) { toast(tr('Fichier Excel : enregistrez-le d\'abord au format CSV (Enregistrer sous → CSV)'), 5000); return; }
    let text; try { text = await f.text(); } catch { toast(tr('Fichier illisible')); return; }
    text = text.replace(/^\ufeff/, '');
    if (/^\s*[{[]/.test(text)) {
      let j; try { j = JSON.parse(text); if (!j || !j.products) throw 0; } catch { toast(tr('Fichier de sauvegarde invalide')); return; }
      askImportMode(j);
      return;
    }
    importStockCSV(text);
  };
  $('#s_upd').onclick = async e => {
    e.preventDefault(); toast(tr('Recherche de mise à jour…'));
    try {
      if ('serviceWorker' in navigator) { const r = await navigator.serviceWorker.getRegistration(); if (r) await r.update(); }
      if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
    } catch {}
    location.reload();
  };
  $('#s_reset').onclick = async () => {
    if (!confirm(tr('Effacer tous les produits et mouvements de cet appareil ?'))) return;
    if (!S.driveOn && !confirm(tr('Drive n\'est pas connecté : les données seront définitivement perdues. Continuer ?'))) return;
    DB = { products: {}, movements: {}, config: {} }; S.dirty = false; saveS(); await persist(); updateBadge(); toast(tr('Données locales effacées'));
  };
}

/* ====== Démarrage ====== */
async function init() {
  const t = safeJSON(localStorage.getItem(TKEY)); if (t.t && t.e > Date.now()) { accessToken = t.t; tokenExp = t.e; }
  try { await idb.open(); const d = await idb.get('db'); if (d && d.products) DB = { products: d.products || {}, movements: d.movements || {}, config: d.config || {} }; }
  catch (e) { toast(tr('Stockage local indisponible : ') + e.message, 5000); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  applyStatic();
  bindMoveDialog();
  $('#btnScan').onclick = () => openScanner(onGlobalScan, true);
  $('#scanMode').onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; S.scanMode = b.dataset.m; saveS(); renderScanMode(); };
  $('#btnNew').onclick = () => { if (location.hash === '#/new') route(); else location.hash = '#/new'; };
  $('#btnSettings').onclick = () => { location.hash = '#/settings'; };
  $('#syncBadge').onclick = () => { if (!S.driveOn) location.hash = '#/settings'; else syncNow(true); };
  $('#scanClose').onclick = () => { scanCb = null; closeScanner(); };
  $('#scanManual').onsubmit = e => { e.preventDefault(); const v = $('#scanInput').value.trim(); if (v && scanCb) scanDone(v); };
  document.addEventListener('click', onUserGesture, true);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.driveOn && tokenValid() && !isEditing()) syncNow(false); });
  route(); updateBadge();
  if (S.driveOn && tokenValid()) syncNow(false);
  if (location.protocol === 'file:') toast(tr('Pour la caméra et Google Drive, ouvrez l\'appli via une adresse https://'), 6000);
}
init();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
  // Nouvelle version installée pendant l'utilisation : pas de rechargement forcé (bloquant avec une mauvaise connexion),
  // elle s'applique à la prochaine ouverture.
  let hadController = !!navigator.serviceWorker.controller, told = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !told) { told = true; toast(tr('Nouvelle version prête : elle s\'appliquera à la prochaine ouverture'), 4000); } });
}
</script>
</body>
</html>
